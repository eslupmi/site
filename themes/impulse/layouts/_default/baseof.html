<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}">
<head>
    <script>
        (function () {
            var t = localStorage.getItem("theme");
            if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.dataset.theme = t;
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Params.description | default .Site.Params.description | plainify | htmlUnescape }}">
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    <link id="docs-css" rel="stylesheet" href="{{ "css/docs.css" | relURL }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NXCTTCP248"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-NXCTTCP248');
    </script>
    {{ partial "components/head" . }}
</head>
<body>
    {{ partial "header.html" . }}
    <div id="page">
    {{ block "main" . }}{{ end }}
    </div>
    <div class="container">
    {{ partial "footer.html" . }}
    </div>
    {{ partial "privacy.html" . }}
    <script src="{{ "js/main.js" | relURL }}"></script>
</body>
</html>
