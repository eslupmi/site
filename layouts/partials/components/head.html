{{ $description := .Params.description | default .Site.Params.description | plainify | htmlUnescape }}
{{ $title := .Title }}
{{ if .IsHome }}{{ $title = .Site.Title }}{{ end }}
{{ $canonical := .Permalink }}
{{ $ogImage := .Params.og_image | default .Site.Params.og_image | absURL }}
<link rel="canonical" href="{{ $canonical }}">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta property="og:locale" content="en_US">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:url" content="{{ $canonical }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:image" content="{{ $ogImage }}">
<meta name="twitter:card" content="{{ .Site.Params.twitter_card | default "summary_large_image" }}">
<meta name="twitter:title" content="{{ $title }}">
<meta name="twitter:description" content="{{ $description }}">
<meta name="twitter:image" content="{{ $ogImage }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ .Site.Title }}",
  "url": "{{ .Site.BaseURL }}",
  "logo": "{{ "/logo.png" | absURL }}"
}
</script>
