name: Deploy site to Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Sync quick start from impulse README
        env:
          IMPULSE_README: https://raw.githubusercontent.com/eslupmi/impulse/develop/README.md
        run: uv run scripts/sync_readme.py

      - name: Build with Hugo
        run: uv run hugo --minify

      - name: Build versioned docs
        run: uv run scripts/build_docs.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
