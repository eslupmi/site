name: Deploy site to Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync features from impulse README
        env:
          IMPULSE_README: https://raw.githubusercontent.com/eslupmi/impulse/develop/README.md
        run: |
          python3 <<'PY'
          import os, pathlib, re, urllib.request
          readme = urllib.request.urlopen(os.environ["IMPULSE_README"]).read().decode()
          section = re.search(r"## Features\n+(.*?)(?=\n## )", readme, re.S).group(1)
          def md(s):
              s = re.sub(r"\*\*(.+?)\*\*", r"<strong>\1</strong>", s)
              s = re.sub(r"\[([^\]]+)\]\(([^)]+)\)", r'<a href="\2" class="brand-color">\1</a>', s)
              return s.replace("https://docs.impulse.bot", "/docs")
          items = []
          for line in section.splitlines():
              m = re.match(r"- (.*)", line)
              if m:
                  items.append(f"<p>{md(m.group(1))}</p>")
          html = "\n      ".join(items)
          path = pathlib.Path("content/_index.md")
          path.write_text(path.read_text().replace("<!-- FEATURES -->", html, 1))
          PY

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.123.7'
          extended: true

      - name: Build with Hugo
        run: hugo --minify

      - name: Setup uv
        uses: astral-sh/setup-uv@v10

      - name: Build versioned docs
        run: python3 scripts/build_docs.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
